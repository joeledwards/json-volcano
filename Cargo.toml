[package]
name = "json-volcano"
version = "1.0.0"
edition = "2024"
description = "Reproducible streaming JSON fixtures with bounded memory"
license = "MIT"
repository = "https://github.com/joeledwards/json-volcano"
readme = "README.md"
keywords = ["json", "generator", "streaming", "testing"]
categories = ["development-tools::testing", "command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }

[[bin]]
name = "json-volcano"
path = "src/main.rs"
required-features = ["cli"]
